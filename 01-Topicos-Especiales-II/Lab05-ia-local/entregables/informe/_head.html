<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Laboratorio 5 — IA local y privada con Ollama</title>
<style>
  @page { size: Letter; margin: 2.5cm; }
  * { box-sizing: border-box; }
  body { font-family: "Times New Roman", Times, serif; font-size: 12pt; line-height: 1.5; text-align: justify; color: #111; margin: 0; }
  h1, h2, h3 { font-family: "Times New Roman", Times, serif; text-align: left; page-break-after: avoid; }
  h1 { font-size: 14pt; margin: 1.4em 0 0.5em; }
  h2 { font-size: 13pt; margin: 1.2em 0 0.4em; }
  h3 { font-size: 12pt; margin: 1em 0 0.3em; }
  h1.nueva-pagina { page-break-before: always; }
  p { margin: 0 0 0.7em 0; }

  .portada { height: 22cm; display: flex; flex-direction: column; align-items: center; text-align: center; page-break-after: always; }
  .portada .logos { display: flex; justify-content: space-between; width: 100%; margin-bottom: 0.8cm; }
  .portada .logos img { width: 105px; height: 105px; object-fit: contain; }
  .portada .titulo-bloque { margin-top: 0.9cm; }
  .portada .titulo-bloque p { margin: 0.35em 0; font-weight: bold; text-transform: uppercase; letter-spacing: 0.3px; }
  .portada .presentado { margin-top: 1.1cm; }
  .portada .presentado p, .portada .revisado p, .portada .fecha p { margin: 0.3em 0; font-weight: bold; text-transform: uppercase; }
  .portada .nombres { font-weight: normal !important; text-transform: none !important; }
  .portada .revisado { margin-top: 1.2cm; }
  .portada .fecha { margin-top: 1.1cm; }

  .indice { page-break-after: always; line-height: 1.25; }
  .indice h1 { text-align: center; }
  .indice ol { list-style: none; padding: 0; margin: 0; }
  .indice li { display: flex; align-items: baseline; margin: 0.2em 0; }
  .indice li.n2 { padding-left: 1.2em; }
  .indice li .t { white-space: nowrap; }
  .indice li .dots { flex: 1; border-bottom: 1px dotted #444; margin: 0 0.3em; transform: translateY(-0.25em); }
  .indice li .p { white-space: nowrap; }

  table { width: 100%; border-collapse: collapse; margin: 0.8em 0; font-size: 10.5pt; page-break-inside: avoid; line-height: 1.3; }
  th, td { border: 1px solid #666; padding: 5px 7px; text-align: left; vertical-align: top; }
  th { background: #e2e2e2; font-weight: bold; }
  .tabla-titulo { font-weight: bold; margin: 0.8em 0 0.2em; text-align: left; page-break-after: avoid; }
  figure { margin: 0.8em 0; text-align: center; page-break-inside: avoid; }
  figure img { max-width: 100%; max-height: 16cm; border: 1px solid #ccc; }
  figcaption { font-size: 10.5pt; font-style: italic; margin-top: 0.3em; line-height: 1.3; }
  ul, ol { margin: 0.3em 0 0.8em 1.3em; padding: 0; }
  li { margin-bottom: 0.3em; }
  pre { font-family: Consolas, "Courier New", monospace; font-size: 9pt; line-height: 1.3; background: #f4f4f4; border: 1px solid #ccc; padding: 6px 8px; margin: 0.6em 0 0.9em; white-space: pre-wrap; text-align: left; page-break-inside: avoid; }
  code { font-family: Consolas, "Courier New", monospace; font-size: 10pt; }
  .referencias p { padding-left: 1.27cm; text-indent: -1.27cm; text-align: left; }
  .hueco { border: 2px dashed #888; padding: 2.2cm 1cm; text-align: center; color: #555; font-style: italic; }
</style>
</head>
